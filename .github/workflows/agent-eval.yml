name: Agent evals

# The Suskii Agent evals against the real model (ADR-106): routing (97 messages, travellers' and
# staff's, 95%), grounding (33 answers: no invention shown, 90% of grounded answers shown) and
# safety (41 red-team cases, no violation). Manual only: every run calls the model provider (a
# few cents). Needs that provider's key as a repository secret: GEMINI_API_KEY for Gemini, which
# answers travellers (ADR-109), or LLM_API_KEY for Anthropic. CI checks the graph, the guard and the
# graders on every change with recorded answers (apps/agent/src/evals/*.test.ts). No job here
# reaches the API, a database or a traveller's data: tool results are fixtures.
#
# "Replay the recorded answers" runs the same jobs on the recorded answers CI uses: no key is
# needed and no model is called. It shows that the workflow itself works (it starts, builds one
# job for each suite asked for, runs the eval and keeps the result); it says nothing about a
# model. Its result is marked `recorded`.
#
# Each suite's result is kept as an artifact (agent-eval-<suite>.json: counts, the ids of the
# cases that did not pass, the model and the commit; never a message or an answer). A super
# admin records it in the console (Assistant cost and quality, Evaluations) so the team sees
# which model was measured and when.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which eval to run
        required: false
        type: choice
        default: all
        options:
          - all
          - routing
          - grounding
          - safety
      recorded:
        description: Replay the recorded answers (no key, no model call; checks the workflow only)
        type: boolean
        default: false
      provider:
        description: Model provider to measure
        type: choice
        default: gemini
        options:
          - gemini
          - anthropic
      router_model:
        description: Model that routes (AGENT_MODEL_ROUTER); empty takes the provider's default
        required: false
        default: ''
      specialist_model:
        description: Model that answers (AGENT_MODEL_SPECIALIST); empty takes the provider's default
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: agent-eval
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  eval:
    name: Agent eval (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # One job for each suite asked for. The list is built from the input here, because a
      # job's own `if` is read before its matrix exists and may not name it: GitHub refuses
      # to load a workflow that does (scripts/check-workflows.mjs keeps watch).
      matrix:
        suite: >-
          ${{ fromJSON(inputs.suite == 'all' && '["routing","grounding","safety"]' ||
          format('["{0}"]', inputs.suite)) }}
    steps:
      - name: Check the model key is set
        if: ${{ !inputs.recorded }}
        env:
          LLM_API_KEY: ${{ inputs.provider == 'gemini' && secrets.GEMINI_API_KEY || secrets.LLM_API_KEY }}
          SECRET_NAME: ${{ inputs.provider == 'gemini' && 'GEMINI_API_KEY' || 'LLM_API_KEY' }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Missing repository secret $SECRET_NAME (the model provider's API key). Add it under Settings, Secrets and variables, Actions, then run this workflow again."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the shared package
        run: pnpm exec turbo run build --filter=@suskii/shared

      - name: Run the eval
        env:
          # A replay never gets the key: nothing in it could call the model by mistake.
          LLM_API_KEY: >-
            ${{ !inputs.recorded && (inputs.provider == 'gemini' && secrets.GEMINI_API_KEY ||
            secrets.LLM_API_KEY) || '' }}
          AGENT_MODEL_PROVIDER: ${{ inputs.provider }}
          AGENT_MODEL_ROUTER: ${{ inputs.router_model }}
          AGENT_MODEL_SPECIALIST: ${{ inputs.specialist_model }}
          SUITE: ${{ matrix.suite }}
          RECORDED: ${{ inputs.recorded }}
        run: |
          args=(--json "$RUNNER_TEMP/agent-eval-$SUITE.json")
          if [ "$RECORDED" = "true" ]; then args+=(--recorded); fi
          pnpm --filter @suskii/agent "eval:agent-$SUITE" "${args[@]}"

      # Kept whether the eval passed or not: a failed run is what needs reading.
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-eval-${{ matrix.suite }}
          path: ${{ runner.temp }}/agent-eval-${{ matrix.suite }}.json
          if-no-files-found: ignore
          retention-days: 90
