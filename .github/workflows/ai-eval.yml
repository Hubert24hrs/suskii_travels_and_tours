name: AI search eval

# The 50-message eval of AI trip search against the real model (ADR-061). Manual only: every run
# calls the model provider (about a cent per run). Needs the LLM_API_KEY repository secret. CI
# checks the pipeline around the model on every change (test/natural-search.e2e-spec.ts).
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to evaluate (LLM_MODEL)
        required: false
        default: claude-haiku-5-5

permissions:
  contents: read

concurrency:
  group: ai-eval
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  eval:
    name: Natural-language search eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Throwaway services: the eval resolves places through the seeded catalog and budgets in
    # Redis. Credentials are CI-only, never real.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: suskii
          POSTGRES_PASSWORD: suskii_ci
          POSTGRES_DB: suskii_eval
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U suskii" --health-interval 5s --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://suskii:suskii_ci@localhost:5432/suskii_eval
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Check the model key is set
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Missing repository secret LLM_API_KEY (the model provider's API key). Add it under Settings, Secrets and variables, Actions, then run this workflow again."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the shared package
        run: pnpm exec turbo run build --filter=@suskii/shared

      - name: Database (migrations and reference data)
        run: |
          pnpm --filter @suskii/api db:deploy
          pnpm --filter @suskii/api db:seed

      - name: Run the eval (fails below 95% exact matches)
        env:
          LLM_PROVIDER: anthropic
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ inputs.model }}
        run: pnpm --filter @suskii/api eval:natural-search
