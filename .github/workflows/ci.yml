name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  EXPO_NO_TELEMETRY: 1
  STORYBOOK_DISABLE_TELEMETRY: 1
  # Pull requests only run tasks for workspaces affected by the diff against the base
  # branch (plus their dependents). Pushes to main and manual runs check everything.
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so `turbo --affected` can find the merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ui-web component tests run in real Chromium (axe colour-contrast needs a browser).
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @suskii/ui-web exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @suskii/ui-web exec playwright install-deps chromium

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint ${{ env.AFFECTED }}

      - name: Typecheck
        run: pnpm typecheck ${{ env.AFFECTED }}

      - name: Unit tests
        run: pnpm test ${{ env.AFFECTED }}

      # Testcontainers starts Postgres and Redis on the runner's Docker daemon.
      - name: E2E tests (API)
        run: pnpm test:e2e ${{ env.AFFECTED }}

      # The OpenAPI document and the generated client are committed; both must match the code.
      - name: Check OpenAPI document and API client are up to date
        run: |
          pnpm generate:api
          git diff --exit-code -- apps/api/openapi.json packages/api-client/src/schema.ts

      - name: Build
        run: pnpm build ${{ env.AFFECTED }}

      - name: Build Storybook
        run: pnpm build:storybook ${{ env.AFFECTED }}
