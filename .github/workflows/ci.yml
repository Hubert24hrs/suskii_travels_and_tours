name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  EXPO_NO_TELEMETRY: 1
  STORYBOOK_DISABLE_TELEMETRY: 1
  # Pull requests only run tasks for workspaces affected by the diff against the base
  # branch (plus their dependents). Pushes to main and manual runs check everything.
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Throwaway services for the web e2e stack and the worker's BullMQ test. The API e2e suite
    # starts its own containers (Testcontainers). Credentials are CI-only, never real ones.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: suskii
          POSTGRES_PASSWORD: suskii_ci
          POSTGRES_DB: suskii_web_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U suskii" --health-interval 5s --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so `turbo --affected` can find the merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ui-web component tests run in real Chromium (axe colour-contrast needs a browser).
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @suskii/ui-web exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @suskii/ui-web exec playwright install-deps chromium

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint ${{ env.AFFECTED }}

      - name: Typecheck
        run: pnpm typecheck ${{ env.AFFECTED }}

      - name: Unit tests
        run: pnpm test ${{ env.AFFECTED }}
        env:
          TEST_REDIS_URL: redis://localhost:6379/1

      # Testcontainers starts Postgres and Redis on the runner's Docker daemon.
      - name: E2E tests (API)
        run: pnpm exec turbo run test:e2e --filter=@suskii/api ${{ env.AFFECTED }}

      # Builds web, API and worker, boots them against the service containers (seed plus one
      # worker refresh), runs the Playwright suite, then the Lighthouse gate on its own.
      - name: E2E and Lighthouse tests (web)
        run: |
          # Lighthouse drives Playwright's headless shell (installed with Chromium).
          CHROME_PATH="$(find ~/.cache/ms-playwright -type f \( -name chrome-headless-shell -o -name headless_shell \) | head -n 1)"
          export CHROME_PATH
          pnpm exec turbo run test:e2e --filter=@suskii/web ${{ env.AFFECTED }}
        env:
          WEB_E2E_DATABASE_URL: postgresql://suskii:suskii_ci@localhost:5432/suskii_web_e2e
          WEB_E2E_REDIS_URL: redis://localhost:6379/2
          LIGHTHOUSE_RUNS: 3

      - name: Upload web test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-reports
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/lighthouse-report/
          if-no-files-found: ignore
          retention-days: 14

      # The OpenAPI document and the generated client are committed; both must match the code.
      - name: Check OpenAPI document and API client are up to date
        run: |
          pnpm generate:api
          git diff --exit-code -- apps/api/openapi.json packages/api-client/src/schema.ts

      - name: Build
        run: pnpm build ${{ env.AFFECTED }}

      # Everything in the app bundle is public; fail if a secret reached it (ADR-024). Native
      # builds (APK, iOS app) are scanned in mobile.yml.
      - name: Scan the mobile bundle for secrets
        # Needs the mobile export, which pull requests skip when the app is unaffected.
        run: |
          node apps/mobile/scripts/scan-bundle.mjs --self-test
          if [ -d apps/mobile/dist ]; then node apps/mobile/scripts/scan-bundle.mjs apps/mobile/dist; fi

      # Tailwind drops unknown classes silently; fail when a class used in the web app has no CSS.
      - name: Check Tailwind classes (web)
        # Needs the web build, which pull requests skip when the web app is unaffected.
        run: |
          if [ -d apps/web/.next ]; then pnpm --filter @suskii/web check:classes; fi

      - name: Build Storybook
        run: pnpm build:storybook ${{ env.AFFECTED }}
