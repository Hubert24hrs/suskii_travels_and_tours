name: Mobile release

# EAS cloud builds for testers and the stores (ADR-024, ADR-060): preview or production on demand,
# and production for `mobile-v*` tags, which EAS Submit sends to TestFlight and the Play internal
# track. Over-the-air JavaScript updates go to the profile's channel with `action: update`; the
# fingerprint runtime policy keeps them off binaries they do not fit. Runs only once the owner's
# Expo account is set up: the EXPO_TOKEN secret, the EAS_PROJECT_ID variable (from `eas init`), the
# profile's public settings as EAS environment variables (https API and web URLs, Play Integrity
# project) and store credentials managed by EAS (App Store Connect API key, Play service account;
# `ascAppId` in eas.json). The bundle is exported and scanned first; an update publishes exactly
# that scanned bundle.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Build a binary, or publish an over-the-air update to the profile's channel
        type: choice
        options: [build, update]
        default: build
      profile:
        description: EAS build profile (and update channel)
        type: choice
        options: [preview, production]
        default: preview
      platform:
        description: Platforms
        type: choice
        options: [all, android, ios]
        default: all
      submit:
        description: Submit a production build to TestFlight and the Play internal track
        type: boolean
        default: false
  push:
    tags: ['mobile-v*']

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ inputs.action || 'build' }}-${{ inputs.profile || 'production' }}
  cancel-in-progress: false

jobs:
  eas:
    name: EAS ${{ inputs.action || 'build' }} ${{ inputs.profile || 'production' }} (${{ inputs.platform || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_NO_TELEMETRY: 1
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      ACTION: ${{ inputs.action || 'build' }}
      APP_VARIANT: ${{ inputs.profile || 'production' }}
      PLATFORM: ${{ inputs.platform || 'all' }}
      # Tags always submit; manual production builds when asked.
      SUBMIT: ${{ (github.event_name == 'push' || inputs.submit) && 'true' || 'false' }}
    steps:
      - name: Check the Expo account is configured
        run: |
          if [ -z "$EXPO_TOKEN" ] || [ -z "$EAS_PROJECT_ID" ]; then
            echo "::error::EAS builds need the owner's Expo account: set the EXPO_TOKEN secret and the EAS_PROJECT_ID variable."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app's workspace dependencies
        run: pnpm exec turbo run build --filter=@suskii/mobile^...

      - name: Set up EAS
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9.0.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The profile's EAS environment variables (public EXPO_PUBLIC_* settings) into .env.local,
      # which the Expo CLI loads, so the scanned bundle matches what EAS builds.
      - name: Load the profile's settings
        working-directory: apps/mobile
        run: eas env:pull --environment "$APP_VARIANT" --non-interactive

      - name: Export and scan the bundle
        working-directory: apps/mobile
        run: |
          pnpm exec expo export --platform android --platform ios --output-dir dist-release
          node scripts/scan-bundle.mjs --self-test
          node scripts/scan-bundle.mjs dist-release

      - name: Build on EAS
        if: env.ACTION == 'build'
        working-directory: apps/mobile
        run: |
          submit_args=()
          if [ "$SUBMIT" = true ]; then
            if [ "$APP_VARIANT" != production ]; then
              echo "::error::Only production builds go to the stores."
              exit 1
            fi
            # EAS Submit profile `production`: TestFlight, and the Play internal track as a draft.
            submit_args=(--auto-submit-with-profile production)
          fi
          eas build --profile "$APP_VARIANT" --platform "$PLATFORM" --non-interactive "${submit_args[@]}"

      # The scanned export, as is: --skip-bundler publishes dist-release instead of rebuilding.
      - name: Publish an over-the-air update
        if: env.ACTION == 'update'
        working-directory: apps/mobile
        env:
          MESSAGE: ${{ github.sha }}
        run: |
          eas update --channel "$APP_VARIANT" --environment "$APP_VARIANT" --platform "$PLATFORM" \
            --skip-bundler --input-dir dist-release --message "$MESSAGE" --non-interactive
