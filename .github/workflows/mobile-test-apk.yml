name: Mobile test APK

# A sideloadable Android test build for people trying the app on a real phone, before the owner's
# Expo account exists (store and tester builds then move to EAS, mobile-release.yml). It is the
# CI release APK built for phone CPUs (arm64-v8a, armeabi-v7a), signed with the debug key, scanned
# for secrets, and published as the `mobile-test-apk` pre-release so it has a stable download URL:
# https://github.com/<owner>/<repo>/releases/download/mobile-test-apk/suskii-travels-test.apk
#
# At launch the app looks for the online test server (test-server.yml, ADR-066) through the
# address file that workflow publishes, so a tester only has to start it on GitHub. The e2e variant
# also allows plain http, so the app can talk to a stack on the tester's own network instead
# (Account, Test server; ADR-054). `api_url` is only the fallback when neither is set. Mock
# attestation; not for production.
#
# The APK is published only after the phone check (phone-check.yml, ADR-100) has installed this
# very file on an emulator and run it against the online test server, so a test server must be
# running (one starts every four hours).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the APK when the phone check passes (off builds and checks only)
        type: boolean
        default: true
      api_url:
        description: API base URL the app calls (http allowed for a local stack)
        default: http://localhost:4000
      web_url:
        description: Website base URL (booking links and legal pages)
        default: http://localhost:3000

permissions:
  contents: read

concurrency:
  group: mobile-test-apk
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  EXPO_NO_TELEMETRY: 1
  APP_VARIANT: e2e
  EXPO_PUBLIC_ATTESTATION: mock
  EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_url }}
  EXPO_PUBLIC_WEB_BASE_URL: ${{ inputs.web_url }}
  EXPO_PUBLIC_TEST_SERVER_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/test-server/test-server.json
  EXPO_PUBLIC_TEST_SERVER_START_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/test-server.yml
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  RELEASE_TAG: mobile-test-apk
  APK_NAME: suskii-travels-test.apk

jobs:
  apk:
    name: Build the test APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Gradle cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app's workspace dependencies
        run: pnpm exec turbo run build --filter=@suskii/mobile^...

      - name: Generate the native Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install

      # Same memory and download settings as the CI build (mobile.yml); phone CPUs instead of the
      # emulator's. Native libraries are compressed in the APK and unpacked at install
      # (`expo.useLegacyPackaging`): the download is a little over half the size (48 MB, not
      # 85 MB), and the phone check's emulator, which translates phone code, only finds libraries
      # that are unpacked (ADR-100).
      - name: Build the release APK (arm64-v8a, armeabi-v7a)
        working-directory: apps/mobile/android
        timeout-minutes: 60
        run: >-
          ./gradlew assembleRelease -x lintVitalRelease
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          -Pexpo.useLegacyPackaging=true
          --no-daemon "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC"
          "-Pkotlin.daemon.jvmargs=-Xmx3g"
          -Dorg.gradle.internal.http.connectionTimeout=60000
          -Dorg.gradle.internal.http.socketTimeout=300000
          -Dorg.gradle.internal.repository.max.tentatives=6
          -Dorg.gradle.internal.repository.initial.backoff=2000

      - name: Scan the APK for secrets
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          rm -rf apk-contents && mkdir apk-contents && unzip -q "$apk" -d apk-contents
          node apps/mobile/scripts/scan-bundle.mjs --self-test
          node apps/mobile/scripts/scan-bundle.mjs apk-contents
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir apk-contents --config .gitleaks.toml --redact --no-banner
          cp "$apk" "$APK_NAME"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"

      - name: Upload the APK as a run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suskii-travels-test-apk
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          retention-days: 14

  # The file just built, on an emulator against the online test server, before anyone downloads it.
  check:
    name: Phone check
    needs: apk
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/phone-check.yml
    with:
      artifact: suskii-travels-test-apk

  publish:
    name: Publish the test APK
    needs: [apk, check]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Only to replace the `mobile-test-apk` pre-release.
      contents: write
      actions: read
    steps:
      - name: Download the checked APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name suskii-travels-test-apk
          sha256sum --check --strict "$APK_NAME.sha256"

      # Replaced on every run so the download URL (and any QR code pointing at it) stays the same.
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Android test build (${GITHUB_SHA::7})" \
            --notes "Test APK from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Signed with the debug key, mock attestation, API ${EXPO_PUBLIC_API_BASE_URL}. It passed the phone check against the online test server before it was published. Not for production."
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}" >> "$GITHUB_STEP_SUMMARY"
