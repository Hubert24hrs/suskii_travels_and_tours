name: Visual baselines

# Regenerates the ui-web reference screenshots on the same runner image and Chromium build that CI
# compares against (phase 11), and commits them to the branch it runs on. Run it after an intended
# visual change from that branch, then review the images in the commit (or the artifact) in the
# pull request like any other change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Update ui-web screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only this job may push, and only the screenshot directory is committed.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @suskii/ui-web exec playwright install --with-deps chromium

      - name: Rewrite the reference screenshots
        run: |
          pnpm exec turbo run build --filter=@suskii/ui-web^...
          pnpm --filter @suskii/ui-web test:visual --update

      - name: Upload screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-web-screenshots
          path: packages/ui-web/src/test/__screenshots__/
          retention-days: 14

      - name: Commit the screenshots
        run: |
          git add packages/ui-web/src/test/__screenshots__/
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "test(ui-web): update reference screenshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
