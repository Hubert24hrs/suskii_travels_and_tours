name: Visual baselines

# Regenerates the ui-web reference screenshots on the same runner image and Chromium build that CI
# compares against (phase 11). Run it after an intended visual change, review the uploaded images,
# then commit them under packages/ui-web/src/test/__screenshots__/.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Update ui-web screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @suskii/ui-web exec playwright install --with-deps chromium

      - name: Rewrite the reference screenshots
        run: |
          pnpm exec turbo run build --filter=@suskii/ui-web^...
          pnpm --filter @suskii/ui-web test:visual --update

      - name: Upload screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-web-screenshots
          path: packages/ui-web/src/test/__screenshots__/
          retention-days: 14
