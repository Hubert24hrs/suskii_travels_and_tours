# Gitleaks configuration (phase 11). The default rules apply; the allowlist below only covers
# values that are fake by construction, never whole files or directories.
title = "Suskii Travels gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures: sequential placeholder digits and the worker's internal API host"
regexTarget = "match"
regexes = [
  # sk_test_0123456789abcdef, whsec_test_0123456789abcdef, FLWSECK_TEST-0123456789
  '''0123456789(abcdef)?''',
  # http://api.internal:4000/v1/internal/... (a hostname, read as a key by generic-api-key)
  '''api\.internal:4000''',
  # `VIATOR_API_KEY=` with no value in .env.example: generic-api-key reads the next line
  # (`VIATOR_CAMPAIGN=suskii`) as its value. Only an empty assignment matches.
  '''\A[A-Z][A-Z0-9_]*=\r?\n''',
  # The Sentry SDK's DSN query template (`sentry_version=7&sentry_key=`) in the app's Hermes
  # bytecode: the string table packs unrelated strings after it (locale tags, SVG paths), which
  # generic-api-key reads as a key. A DSN's public key is public by design (ADR-046).
  '''\Asentry_key=''',
]
