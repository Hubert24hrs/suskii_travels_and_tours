# The hotel form on Home after a search and a visit elsewhere. Reported from a phone: after a
# hotel search, another section and the way back, "Continue your search", the destination field
# and Search did nothing. The flow makes a search, leaves by the bottom tabs and by the search
# card's own tabs, and uses each of the three again. Home shows one search form at a time, so
# opening another tab takes the hotel form down: it must come back holding the destination
# (the form keeps what was typed), so Search works at once.
appId: com.suskii.travels.e2e
name: Hotel form after returning
tags:
  - hotels
---
- launchApp:
    clearState: true
- runFlow: subflows/dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible:
      id: flight-search-form
    timeout: 60000
- tapOn:
    id: search-tab-hotels
- extendedWaitUntil:
    visible:
      id: hotel-search-form
    timeout: 10000

# 1. A first search: Lagos, on the form's own dates and guests.
- tapOn:
    id: hotel-destination
- inputText: Lagos
- hideKeyboard
- tapOn: 'Lagos, Nigeria'
- scrollUntilVisible:
    element:
      id: hotel-submit
- tapOn:
    id: hotel-submit
- extendedWaitUntil:
    visible:
      id: hotel-result
    timeout: 60000
- back
- extendedWaitUntil:
    visible:
      id: hotel-search-form
    timeout: 10000

# 2. Another section and back, by the bottom tabs.
- tapOn:
    id: tab-deals
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible:
      id: hotel-search-form
    timeout: 10000

# 3. Another tab of the search card and back: the form comes back with the destination it
#    held, Search searches without typing it again, and the search just made is offered.
- scrollUntilVisible:
    element:
      id: search-tab-cars
    direction: UP
- tapOn:
    id: search-tab-cars
- tapOn:
    id: search-tab-hotels
- extendedWaitUntil:
    visible: 'Lagos, Nigeria'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: hotel-submit
- tapOn:
    id: hotel-submit
- extendedWaitUntil:
    visible:
      id: hotel-result
    timeout: 60000
- back
- extendedWaitUntil:
    visible:
      id: hotel-search-form
    timeout: 10000
- scrollUntilVisible:
    element:
      id: recent-hotel-search
    direction: UP
- tapOn:
    id: recent-hotel-search
- extendedWaitUntil:
    visible:
      id: hotel-result
    timeout: 60000
- back
- extendedWaitUntil:
    visible:
      id: hotel-search-form
    timeout: 10000

# 4. The destination takes typing again, and Search searches the new place.
- scrollUntilVisible:
    element:
      id: hotel-destination
- tapOn:
    id: hotel-destination
- eraseText: 30
- inputText: Abuja
- hideKeyboard
- tapOn: 'Abuja, Nigeria'
- scrollUntilVisible:
    element:
      id: hotel-submit
- tapOn:
    id: hotel-submit
- extendedWaitUntil:
    visible:
      id: hotel-result
    timeout: 60000
