# Local development infrastructure. Start with `pnpm infra:up` (or `docker compose up -d --wait`).
# Every port binds to 127.0.0.1 so nothing is exposed to the local network.
# Credentials below are local-only defaults, overridable from a root `.env` file.
name: suskii

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-suskii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suskii_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-suskii}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # BullMQ requires `noeviction`: evicted queue keys mean silently lost jobs.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 12

  # Optional virus scanner for visa documents (ADR-026): `docker compose --profile av up -d`.
  # Needs about 1 GB of memory for its signatures; the mock scanner is the default otherwise.
  clamav:
    image: clamav/clamav:1.4
    profiles: ['av']
    restart: unless-stopped
    ports:
      - '127.0.0.1:${CLAMAV_PORT:-3310}:3310'
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  # Optional S3-compatible object store for OBJECT_STORAGE=s3 (ADR-057):
  # `docker compose --profile s3 up -d`. Versity's gateway checks SigV4 signatures as S3 does;
  # create the bucket once with any S3 client. Local credentials only.
  s3:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    profiles: ['s3']
    restart: unless-stopped
    command:
      [
        '--access',
        '${S3_LOCAL_ACCESS_KEY:-suskii-local}',
        '--secret',
        '${S3_LOCAL_SECRET_KEY:-suskii-local-secret}',
        'posix',
        '/data',
      ]
    ports:
      - '127.0.0.1:${S3_PORT:-7070}:7070'
    volumes:
      - s3-data:/data

volumes:
  postgres-data:
  redis-data:
  clamav-data:
  s3-data:
