# Ask Suskii's three evals (routing, grounding, safety) against the model it answers with:
# Gemini through Vertex AI, called as the build's own identity, with no key (ADR-112). The rule
# of ADR-106 holds here as with a key: a change to a prompt, a tool or a model passes these
# against the model before it answers travellers. From the repository root:
#
#   gcloud builds submit . --config=infra/gcp/cloudbuild.agent-eval.yaml \
#     --service-account=projects/PROJECT/serviceAccounts/suskii-build@PROJECT.iam.gserviceaccount.com \
#     --gcs-source-staging-dir=gs://PROJECT-build-source/source
#
# The build identity holds the one permission it needs (scripts/gcp/deploy-vm.sh grants the
# custom role suskiiModelCaller). No eval reaches the API, a database or a traveller's data:
# tool results are fixtures. A run costs a few cents at the model's list price; the log prints
# the tokens used. Nothing but counts, case ids and model names is printed.
steps:
  - id: evals
    name: node:24.21.0-alpine3.24@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    entrypoint: sh
    env:
      - TURBO_TELEMETRY_DISABLED=1
      - AGENT_MODEL_PROVIDER=vertex
      - AGENT_VERTEX_PROJECT=$PROJECT_ID
      - AGENT_VERTEX_LOCATION=${_LOCATION}
      - AGENT_MODEL_ROUTER=${_MODEL}
      - AGENT_MODEL_SPECIALIST=${_MODEL}
      - AGENT_MODEL_FALLBACK=${_MODEL}
    args:
      - -c
      - |
        set -eu
        corepack enable
        pnpm install --frozen-lockfile --ignore-scripts --filter '@suskii/agent...' >/dev/null
        pnpm exec turbo run build --filter='@suskii/agent^...' --output-logs=errors-only
        failed=0
        for suite in routing grounding safety; do
          pnpm --silent --filter @suskii/agent "eval:agent-$suite" || failed=1
        done
        exit "$failed"
substitutions:
  _LOCATION: europe-west2
  _MODEL: gemini-3.5-flash
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
