# Builds the website's and the admin console's images for one environment (ADR-111) and pushes
# them to the project's Artifact Registry. Unlike the backend's images they are built for the
# addresses they are served on: those are compiled into the pages, so the tag names the commit
# and those addresses. The same Dockerfiles as the release pipeline. Started by
# scripts/gcp/deploy-vm.sh.
steps:
  - id: web
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --file=apps/web/Dockerfile
      - --build-arg=VERSION=${_TAG}
      - --build-arg=REVISION=${_TAG}
      - --build-arg=NEXT_PUBLIC_API_BASE_URL=${_API_URL}
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_WEB_URL}
      - --build-arg=NEXT_PUBLIC_ADMIN_URL=${_ADMIN_URL}
      - --build-arg=NEXT_PUBLIC_TURNSTILE_SITE_KEY=${_TURNSTILE_SITE_KEY}
      - --build-arg=NEXT_PUBLIC_SENTRY_ENVIRONMENT=${_ENVIRONMENT}
      - --tag=${_REGISTRY}/suskii-web:${_SITES_TAG}
      - .
  - id: admin
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --file=apps/admin/Dockerfile
      - --build-arg=VERSION=${_TAG}
      - --build-arg=REVISION=${_TAG}
      - --build-arg=NEXT_PUBLIC_API_BASE_URL=${_API_URL}
      - --build-arg=NEXT_PUBLIC_ADMIN_URL=${_ADMIN_URL}
      - --build-arg=NEXT_PUBLIC_SENTRY_ENVIRONMENT=${_ENVIRONMENT}
      - --tag=${_REGISTRY}/suskii-admin:${_SITES_TAG}
      - .
images:
  - ${_REGISTRY}/suskii-web:${_SITES_TAG}
  - ${_REGISTRY}/suskii-admin:${_SITES_TAG}
substitutions:
  _REGISTRY: ''
  _TAG: ''
  _SITES_TAG: ''
  _API_URL: ''
  _WEB_URL: ''
  _ADMIN_URL: ''
  _TURNSTILE_SITE_KEY: ''
  _ENVIRONMENT: ''
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 3600s
