{{- $name := printf "%s-admin" (include "suskii.fullname" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "suskii.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: {{ .Values.admin.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      {{- include "suskii.selector" (list . "admin") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "suskii.labels" . | nindent 8 }}
        app.kubernetes.io/component: admin
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "suskii.podSecurityContext" . | nindent 8 }}
      {{- include "suskii.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: admin
          image: {{ include "suskii.image" (list . "admin") }}
          ports:
            - { name: http, containerPort: 3001 }
          env:
            - { name: HOSTNAME, value: 0.0.0.0 }
            - { name: PORT, value: '3001' }
          startupProbe:
            httpGet: { path: /sign-in, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /sign-in, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /sign-in, port: http }
            periodSeconds: 15
            failureThreshold: 4
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
          securityContext:
            {{- include "suskii.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/apps/admin/.next/cache }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 128Mi } }
        - { name: next-cache, emptyDir: { sizeLimit: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "suskii.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  selector:
    {{- include "suskii.selector" (list . "admin") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
