{{- $name := printf "%s-api" (include "suskii.fullname" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "suskii.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  # A new revision takes traffic only once /ready answers (Postgres and Redis reachable); a broken
  # release never replaces a working pod, and `helm upgrade --atomic` rolls it back (ADR-060).
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      {{- include "suskii.selector" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "suskii.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "suskii.podSecurityContext" . | nindent 8 }}
      {{- include "suskii.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "suskii.image" (list . "api") }}
          ports:
            - { name: http, containerPort: 4000 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: API_PORT, value: '4000' }
            - { name: SENTRY_ENVIRONMENT, value: {{ .Values.global.environment | quote }} }
            - { name: WEB_APP_URL, value: {{ .Values.global.urls.web | quote }} }
            - { name: CORS_ORIGINS, value: {{ printf "%s,%s" .Values.global.urls.web .Values.global.urls.admin | quote }} }
            - { name: ADMIN_ORIGINS, value: {{ .Values.global.urls.admin | quote }} }
            - { name: COOKIE_SECURE, value: 'true' }
            {{- if .Values.api.clientIpHeader }}
            - { name: CLIENT_IP_HEADER, value: {{ .Values.api.clientIpHeader | quote }} }
            {{- else }}
            - { name: TRUST_PROXY_HOPS, value: {{ .Values.api.trustProxyHops | quote }} }
            {{- end }}
            {{- include "suskii.plainEnv" (list "api.env" .Values.api.env (list "NODE_ENV" "API_PORT" "SENTRY_ENVIRONMENT" "WEB_APP_URL" "CORS_ORIGINS" "ADMIN_ORIGINS" "COOKIE_SECURE" "CLIENT_IP_HEADER" "TRUST_PROXY_HOPS")) | nindent 12 }}
          envFrom:
            - secretRef: { name: {{ .Values.secrets.api }} }
          startupProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            failureThreshold: 4
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "suskii.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "suskii.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "suskii.selector" (list . "api") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
