{{- /* The database step of every install and upgrade (ADR-060): migrations as the schema owner,
       the reference seed, then the app role. It runs before any new pod; if it fails, Helm stops
       the release and `--atomic` restores the previous one. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "suskii.fullname" . }}-migrate
  labels:
    {{- include "suskii.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '0'
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "suskii.selector" (list . "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "suskii.fullname" . }}-migrate
      automountServiceAccountToken: false
      securityContext:
        {{- include "suskii.podSecurityContext" . | nindent 8 }}
      {{- include "suskii.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "suskii.image" (list . "migrate") }}
          env:
            - { name: NODE_ENV, value: production }
            # The root file system is read-only; tools that cache under $HOME use /tmp.
            - { name: HOME, value: /tmp }
          envFrom:
            - secretRef: { name: {{ .Values.secrets.migrate }} }
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          securityContext:
            {{- include "suskii.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
