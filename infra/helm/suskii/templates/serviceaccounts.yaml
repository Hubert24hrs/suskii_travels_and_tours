{{- /* One identity per component, without API tokens (no component calls the Kubernetes API). Bind
       cloud identities here (GKE Workload Identity, EKS IRSA) through annotations. */}}
{{- range $component := list "api" "worker" "web" "admin" "migrate" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "suskii.fullname" $ }}-{{ $component }}
  labels:
    {{- include "suskii.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- if eq $component "migrate" }}
  {{- /* The migrate Job is a pre-install hook, and hooks run before the release's ordinary
         resources exist: its identity is a hook too, created just before it. */}}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-10'
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
automountServiceAccountToken: false
{{- end }}
